<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Warehouse barcode scanner</title>
<link rel="stylesheet" href="/style.css">
<body class="scanner">
<div class="camera"><video id="video" autoplay muted playsinline></video><img id="mask" alt="Detected barcode bars" hidden><div class="aim" hidden></div></div>
<div class="controls">
  <button id="start" class="primary" aria-label="Start camera">Start</button>
  <button id="stop" disabled>Stop</button>
  <label><input id="filter" type="checkbox" checked> Mask</label>
  <label><input id="cell-data" type="checkbox" aria-label="Include cell contents"> Cell contents</label>
</div>
<p id="status" role="status" aria-live="polite" hidden></p>
<p id="rate" hidden></p>
<output id="result" aria-label="Last barcode">—</output>
<section id="lookup" hidden aria-live="polite">
  <p id="product"></p>
  <output id="locations" aria-label="Warehouse locations"></output>
  <div id="cells" hidden></div>
</section>
<p id="delivery" role="status" aria-live="polite" hidden></p>
<button id="retry" hidden>Retry sending</button>
<script src="/scanner.js" defer></script>
</html>
