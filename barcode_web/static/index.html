<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warehouse barcode scanner</title>
<link rel="stylesheet" href="/style.css">
<h1>Barcode scanner</h1>
<div class="camera"><video id="video" autoplay muted playsinline></video><div class="aim" hidden></div></div>
<div class="controls">
  <button id="start" class="primary">Start camera</button>
  <button id="stop" disabled>Stop</button>
  <label><input id="filter" type="checkbox" checked> Sharpen alternate frames</label>
</div>
<p id="status" role="status" aria-live="polite">Open the current phone link from the laptop receiver.</p>
<p id="rate" class="muted">Target: 15 scans/s. Camera preview runs independently.</p>
<output id="result" aria-label="Last barcode">No barcode yet</output>
<section id="lookup" hidden aria-live="polite">
  <p id="product"></p>
  <output id="locations" aria-label="Warehouse locations"></output>
</section>
<p id="delivery" role="status" aria-live="polite"></p>
<button id="retry" hidden>Retry sending</button>
<p class="muted">Keep the whole barcode inside the box. Move it out briefly before scanning it again. Only barcode text is sent to the laptop.</p>
<script src="/scanner.js" defer></script>
</html>
