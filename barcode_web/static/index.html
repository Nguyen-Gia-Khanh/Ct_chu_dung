<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123A5E">
<title>Quét mã kho hàng</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
<body class="scanner">
<header class="bar">
  <span id="link-state" class="pill" data-state="off">Camera đã tắt</span>
  <div class="tools">
    <button id="torch" class="icon" type="button" aria-pressed="false" aria-label="Đèn pin" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8v4l-2 3v13h-4V9L8 6z"/><path d="M11 12h2v3h-2z" class="cut"/></svg>
    </button>
    <button id="sound" class="icon" type="button" aria-pressed="true" aria-label="Âm báo khi quét">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" class="wave"/></svg>
    </button>
  </div>
</header>
<div class="camera">
  <div class="camera-view">
    <video id="video" autoplay muted playsinline></video>
    <div class="window" id="window">
      <img id="mask" alt="Các vạch mã được phát hiện" hidden>
      <div id="barcode-box" hidden aria-hidden="true"></div>
    </div>
  </div>
  <p id="hint" class="hint">Bấm Mở camera, rồi đưa toàn bộ mã vạch vào khung.</p>
  <label class="zoom" id="zoom-control" hidden>
    <span>Thu phóng</span><input id="zoom" type="range" min="1" max="1" step="0.1" value="1" aria-label="Thu phóng">
  </label>
</div>
<div class="controls">
  <button id="start" class="primary" type="button" aria-label="Mở camera">Mở camera</button>
  <button id="stop" class="secondary" type="button" hidden>Dừng</button>
  <label class="toggle"><input id="cell-data" type="checkbox" aria-label="Hiện hàng trong ô"><span>Hàng trong ô</span></label>
  <label class="toggle"><input id="filter" type="checkbox" aria-label="Lọc ảnh"><span>Lọc ảnh</span></label>
</div>
<p id="status" role="status" aria-live="polite" hidden></p>
<p id="rate" hidden></p>
<main class="sheet">
  <form id="search" class="search" role="search">
    <input id="manual" type="search" placeholder="Nhập mã vạch" aria-label="Mã vạch cần tìm" maxlength="4096"
           autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button class="primary" type="submit">Tìm</button>
  </form>
  <output id="locations" aria-label="Vị trí trong kho" aria-live="polite"></output>
  <div class="read">
    <output id="result" aria-label="Mã vạch vừa quét">—</output>
    <span id="badge" class="badge" hidden></span>
  </div>
  <p id="empty" class="empty">Sản phẩm và vị trí trên kệ sẽ hiện ở đây sau khi quét.</p>
  <section id="lookup" hidden aria-live="polite">
    <p id="product"></p>
    <div id="cells" hidden></div>
  </section>
  <div class="delivery">
    <p id="delivery" role="status" aria-live="polite" hidden></p>
    <button id="retry" class="secondary" type="button" hidden>Gửi lại</button>
  </div>
</main>
<script src="/scanner.js" defer></script>
</html>
