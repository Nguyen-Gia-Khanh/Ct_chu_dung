[package]
name = "warehouse-mapper"
version = "0.1.0"
description = "Warehouse Shelf Mapper desktop app"
edition = "2021"

[lib]
name = "warehouse_mapper_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
